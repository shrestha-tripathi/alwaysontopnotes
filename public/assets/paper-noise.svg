<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <!--
    Paper-grain texture overlay for sticky cards (UX-CHARTER §3).
    Desaturated fractal noise at ~3.5% opacity — composites OVER each card's
    literal swatch background-color, giving flat pastels a tactile paper feel.
    Self-contained (<1 KB), tiles seamlessly via stitchTiles, theme-neutral
    (gray grain reads the same over every swatch and in both light/dark chrome).
  -->
  <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="7" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
  </filter>
  <rect width="140" height="140" filter="url(#paperGrain)" opacity="0.038"/>
</svg>
